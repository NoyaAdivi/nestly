name: Keep Supabase awake

# Pings the database every 3 days so Supabase does not pause the free project.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://jxjjjhwdavfwbabynrxh.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ampqaHdkYXZmd2JhYnlucnhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwODAwMDcsImV4cCI6MjExMDY1NjAwN30.YHxxVivR3zCo1ZmICJHtLsBQcWmPNFdXCLmdo7dYaO0
        run: |
          curl -sS --fail -X POST "$URL/rest/v1/rpc/nestly_info" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE"}'
          echo " Supabase is awake"
