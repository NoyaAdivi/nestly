<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="נבנה על ידי נויה אדיבי" xmlns:c2pa="http://c2pa.org/manifest"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDF0FC"/><stop offset=".5" stop-color="#E4F7EF"/><stop offset="1" stop-color="#ECE8FD"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1B2D5C"/><stop offset=".55" stop-color="#3A8FD0"/><stop offset="1" stop-color="#2F8F6F"/></linearGradient>
<path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/><clipPath id="c"><rect width="1200" height="170" rx="28"/></clipPath></defs><style>
.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-.9s}.d2{animation-delay:-1.8s}.d3{animation-delay:-2.6s}
.tw{animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.rise{animation:rise .9s ease-out both}.r2{animation-delay:.2s}.r3{animation-delay:.4s}
.walk{stroke-dasharray:3 15;animation:walk 3s linear infinite}
@keyframes drift{to{transform:translate(40px,-20px) scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes walk{to{stroke-dashoffset:-54}}
@media (prefers-reduced-motion:reduce){.blob,.bob,.tw,.rise,.walk{animation:none!important}}
</style><g clip-path="url(#c)"><rect width="1200" height="170" fill="url(#bg)"/><circle class="blob" cx="110" cy="160" r="95" fill="#CDE6FB" opacity=".7"/><circle class="blob b2" cx="1090" cy="20" r="105" fill="#BFEBDA" opacity=".6"/><circle class="blob" cx="980" cy="200" r="70" fill="#F9DBE3" opacity=".6"/><use class="tw" href="#s" x="290" y="50" fill="#7CC4EF"/><use class="tw t2" href="#s" x="190" y="104" fill="#B4A9F2"/><use class="tw t3" href="#s" x="910" y="50" fill="#F6B8C6"/><use class="tw" href="#s" x="1010" y="104" fill="#8FDCC0"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Rubik,Helvetica,Arial,sans-serif" text-anchor="middle" direction="rtl"><text class="rise" x="600" y="72" font-size="46" font-weight="800" fill="url(#t)">נבנה על ידי נויה אדיבי</text><text class="rise r2" x="600" y="112" font-size="23" fill="#5D6E92">שאלות, פידבק או הזדמנויות, אשמח להתחבר</text></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>