<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbb8ff"/>
      <stop offset=".5" stop-color="#ffc4dc"/>
      <stop offset="1" stop-color="#ffd8b8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c84ff"/>
      <stop offset="1" stop-color="#7a5fe8"/>
    </linearGradient>
    <linearGradient id="nest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b38a"/>
      <stop offset="1" stop-color="#d98a5f"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fbd"/>
      <stop offset="1" stop-color="#f0609c"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#6a4fd0" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="512" height="512" rx="128" fill="url(#glow)"/>
  <g filter="url(#sh)">
    <!-- chimney -->
    <rect x="318" y="118" width="40" height="76" rx="12" fill="#8d74f5"/>
    <!-- house body -->
    <path d="M124 248 256 138l132 110v118a30 30 0 0 1-30 30H154a30 30 0 0 1-30-30z" fill="#fffdfc"/>
    <!-- roof -->
    <path d="M96 258 256 124l160 134" fill="none" stroke="url(#roof)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- heart door -->
    <path d="M256 346c-30-20-52-38-52-62 0-17 13-30 29-30 11 0 19 5 23 13 4-8 12-13 23-13 16 0 29 13 29 30 0 24-22 42-52 62z" fill="url(#heart)"/>
    <!-- window sparkle -->
    <circle cx="176" cy="276" r="16" fill="#cfe9ff"/>
    <circle cx="336" cy="276" r="16" fill="#c6f2df"/>
    <!-- nest -->
    <path d="M92 360c40 70 288 70 328 0" fill="none" stroke="url(#nest)" stroke-width="34" stroke-linecap="round"/>
    <path d="M128 384c36 26 220 26 256 0" fill="none" stroke="#fff3e8" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <path d="M110 368c50 50 242 50 292 0" fill="none" stroke="#c97a50" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 16" opacity=".55"/>
  </g>
  <!-- stars -->
  <path d="M410 92l9 21 21 9-21 9-9 21-9-21-21-9 21-9z" fill="#fff"/>
  <circle cx="440" cy="190" r="9" fill="#fff6c9"/>
  <circle cx="86" cy="120" r="7" fill="#fff" opacity=".85"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
