<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nestly · הבית המשותף שלנו</title>
<meta name="description" content="Nestly: משימות הבית ורשימת קניות משותפת לכל בני הבית, עם קוד הצטרפות, תורנויות, נקודות ואנימציות.">
<meta name="theme-color" content="#c9b8ff">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">דילוג לתוכן הראשי</a>
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<header class="topbar">
  <button class="brand" data-go="home" aria-label="Nestly, מעבר לדף הבית">
    <img src="icon.svg" alt="" width="40" height="40" class="logo">
    <span class="brand-txt"><b>Nestly</b><small id="home-name"></small></span>
  </button>
  <div class="top-actions">
    <span class="sync" id="sync" role="status" aria-live="polite"><i></i><span>מקומי</span></span>
    <button class="icon-btn" data-act="a11y" aria-label="הגדרות נגישות">♿</button>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<button class="fab" id="fab" data-act="fab" aria-label="הוספה" hidden><span>+</span></button>

<nav class="tabbar" id="tabbar" aria-label="ניווט ראשי" hidden>
  <button class="tab" data-go="home"><span class="ico">🏡</span><span>בית</span></button>
  <button class="tab" data-go="tasks"><span class="ico">🧹</span><span>משימות</span><em class="badge" id="b-tasks" hidden></em></button>
  <button class="tab" data-go="shop"><span class="ico">🛒</span><span>קניות</span><em class="badge" id="b-shop" hidden></em></button>
  <button class="tab" data-go="family"><span class="ico">👨‍👩‍👧</span><span>הבית שלנו</span></button>
</nav>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-card">
    <span class="grab" aria-hidden="true"></span>
    <button class="x" data-act="close" aria-label="סגירה">✕</button>
    <div id="sheet-body"></div>
  </div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
