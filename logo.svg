<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8dcff"/>
      <stop offset=".55" stop-color="#b6efe0"/>
      <stop offset="1" stop-color="#dbf7cc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".2" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#3a9fd6"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f8ff"/>
      <stop offset="1" stop-color="#c7ecff"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fb5a8"/>
      <stop offset="1" stop-color="#1f8f9e"/>
    </linearGradient>
    <linearGradient id="nest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dcb4"/>
      <stop offset="1" stop-color="#d9b584"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1f6f8f" flood-opacity=".28"/>
    </filter>
  </defs><style>
.bd{transform-origin:256px 340px;animation:bob 3.6s ease-in-out infinite}
.ey{transform-origin:304px 240px;animation:blink 4.2s infinite}
.wg{transform-origin:206px 322px;animation:flap 3.6s ease-in-out infinite}
.lf{transform-origin:392px 128px;animation:sway 4s ease-in-out infinite}
.st{transform-origin:96px 117px;animation:tw 2.6s ease-in-out infinite}
.s2{animation:tw2 3s ease-in-out infinite .8s}
@keyframes bob{50%{transform:translateY(-7px) rotate(-1.5deg)}}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
@keyframes flap{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-12deg)}86%{transform:rotate(4deg)}}
@keyframes sway{50%{transform:rotate(-14deg)}}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.55) rotate(45deg);opacity:.6}}
@keyframes tw2{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="512" height="512" rx="128" fill="url(#glow)"/>
  <!-- leaf sprig -->
  <g class="lf">
    <path d="M392 128c18-30 50-40 72-34-6 26-32 48-72 34z" fill="#6fd3a8"/>
    <path d="M392 128c22-12 44-20 66-30" stroke="#3fae86" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g filter="url(#sh)">
    <!-- bird body -->
    <g class="bd">
      <ellipse cx="256" cy="282" rx="118" ry="104" fill="url(#body)"/>
      <ellipse cx="276" cy="308" rx="70" ry="62" fill="url(#belly)"/>
      <!-- roof hat: the bird wears a little house roof -->
      <path d="M170 196 256 128l86 68" fill="none" stroke="url(#roof)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="300" y="128" width="24" height="40" rx="8" fill="#1f8f9e"/>
      <!-- eye -->
      <g class="ey"><circle cx="304" cy="240" r="17" fill="#17324a"/><circle cx="310" cy="234" r="6" fill="#fff"/></g>
      <!-- cheek -->
      <ellipse cx="320" cy="276" rx="16" ry="10" fill="#ffb3c8" opacity=".75"/>
      <!-- beak -->
      <path d="M362 250l40 12-40 14z" fill="#ffbe6e"/>
      <!-- wing = check mark -->
      <path class="wg" d="M168 284l38 38 72-80" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- nest -->
    <path d="M110 340c0 70 66 104 146 104s146-34 146-104z" fill="url(#nest)"/>
    <path d="M108 342c50 22 246 22 296 0" fill="none" stroke="#c99d68" stroke-width="16" stroke-linecap="round"/>
    <path d="M140 378c40 18 192 18 232 0M162 410c30 12 158 12 188 0" fill="none" stroke="#fff7e8" stroke-width="7" stroke-linecap="round" opacity=".85"/>
    <path d="M128 360c50 26 206 26 256 0" fill="none" stroke="#b88a55" stroke-width="5" stroke-dasharray="16 14" stroke-linecap="round" opacity=".55"/>
  </g>
  <!-- sparkles -->
  <path class="st" d="M96 96l9 21 21 9-21 9-9 21-9-21-21-9 21-9z" fill="#fff"/>
  <circle class="s2" cx="140" cy="186" r="8" fill="#fff" opacity=".9"/>
  <circle cx="446" cy="214" r="7" fill="#fff" opacity=".8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
